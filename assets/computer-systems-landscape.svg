<text x="65" y="79" font-family="Georgia,serif" font-weight="700" font-size="52" letter-spacing="1">THE COMPUTER SYSTEMS LANDSCAPE</text>
<text x="69" y="120" font-size="25">计算机系统 · 知识地图</text>
<text x="70" y="158" font-size="18" font-style="italic" fill="#49463f">Abstractions, not a sequence of CPU execution steps</text>
<text x="68" y="684" font-weight="700" font-size="27">① 数字逻辑与硬件</text>
<text x="326" y="560" font-weight="700" font-size="25">② 计算机体系结构</text>
<text x="545" y="284" font-weight="700" font-size="27">③ 操作系统</text>
<text x="849" y="109" font-weight="700" font-size="29">④ 程序与运行时</text>
<text x="79" y="367" font-weight="700" font-size="25">编程语言与工具链</text>
<text x="80" y="398" font-size="19" font-style="italic">Languages &amp; Compilers</text>
<text x="915" y="456" font-weight="700" font-size="25">计算机网络</text>
<text x="919" y="483" font-size="18" font-style="italic">Cross-layer links</text>
<text x="1112" y="335" font-weight="700" font-size="25">数据库系统</text>
<text x="1112" y="362" font-size="18" font-style="italic">Data &amp; storage</text>
<text x="1284" y="314" font-weight="700" font-size="27">分布式系统</text>
<text x="1287" y="343" font-size="18" font-style="italic">Multiple machines</text>
<text x="81" y="795" font-size="18" fill="#615c51">主路线：抽象与依赖   ·   支路：跨层主题   ·   第二座山：多机协作</text>
